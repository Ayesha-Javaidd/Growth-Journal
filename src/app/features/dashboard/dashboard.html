<app-page-container>

    <!-- Hero -->
    <app-hero-banner></app-hero-banner>

    <!-- Continue Journey -->
    <section class="mt-10">

        <app-section-title
            title="Continue Your Journey"
            subtitle="Resume where you left off">
        </app-section-title>

        <div class="mt-5 grid grid-cols-1 gap-6 md:grid-cols-3">

            <app-feature-card
                icon="🕌"
                title="Salah"
                subtitle="Track today's prayers"
                actionText="Open">
            </app-feature-card>

            <app-feature-card
                icon="📖"
                title="Quran"
                subtitle="Continue reading"
                actionText="Read">
            </app-feature-card>

            <app-feature-card
                icon="📚"
                title="Seerah"
                subtitle="Continue your notes"
                actionText="Explore">
            </app-feature-card>

        </div>

    </section>

    <!-- Today's Focus -->
    <section class="mt-10">

        <app-focus-card></app-focus-card>

    </section>

    <!-- Prayer Tracker -->
    <section class="mt-10">

        <app-prayer-tracker></app-prayer-tracker>

    </section>

    <!-- Weekly Consistency -->
    <section class="mt-10">

        <app-consistency-heatmap></app-consistency-heatmap>

    </section>

    <!-- Reflection -->
    <section class="mt-10">

        <app-journal-card></app-journal-card>

    </section>

    <!-- Timeline -->
    <section class="mt-10">

        <app-timeline></app-timeline>

    </section>

    <!-- Quick Actions -->
    <section class="mt-10 mb-10">

        <app-quick-actions></app-quick-actions>

    </section>

</app-page-container>
