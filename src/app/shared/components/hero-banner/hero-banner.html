<section
    class="relative overflow-hidden rounded-[36px]
           border border-rose-100
           bg-gradient-to-br
           from-rose-50
           via-white
           to-pink-100
           p-10 shadow-sm">

    <div class="max-w-3xl">

        <p
            class="uppercase tracking-[0.35em]
                   text-xs text-rose-500">

            Islamic Growth Journal

        </p>

        <h1
            class="mt-4 text-5xl font-bold
                   text-[var(--color-primary-dark)]">

            {{ greeting() }}

            <span *ngIf="name">

                , {{ name }}

            </span>

        </h1>

        <p class="mt-3 text-gray-500">

            {{ date() }}

            •

            {{ hijriDate() }}

        </p>

        <div class="mt-8">

            <app-quote-card
                [verse]="verse()"
                [reference]="reference()">
            </app-quote-card>

        </div>

    </div>

    <div
        class="absolute -top-24 -right-24
               h-80 w-80 rounded-full
               bg-rose-200/30 blur-3xl">
    </div>

</section>
